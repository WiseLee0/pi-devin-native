name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.22.2"
          - os: ubuntu-latest
            node: "24"
          - os: macos-latest
            node: "22.22.2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, mock tests, and package audit
        run: npm run check
        env:
          PI_OFFLINE: "1"
